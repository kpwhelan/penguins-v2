# Add these directives inside the Forge site's existing server block.
# The location inherits the site's existing public root, so it continues to
# work with Forge zero-downtime deployment paths.
error_page 500 502 503 504 /server-unavailable.html;

location = /server-unavailable.html {
    internal;
    add_header Cache-Control "no-store, max-age=0" always;
}
